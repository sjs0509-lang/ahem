<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stanley Park — 길을 잃었다고 느낀 순간</title>
  <meta name="description" content="밴쿠버 스탠리파크, 자전거를 타다 세 번 길을 잃었다. 그때마다 시간은 다르게 흘렀다.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">

<body>
  <!-- 화면은 모두 main.js가 data.js를 읽어 만든다 -->

  <section class="screen intro" id="intro"></section>
  <section class="screen legend" id="legend"></section>

  <!-- 2. 본편: 지점마다 위치 → 상황 → 체감 → 해결 -->
  <div id="points"></div>

  <!-- 3. 정리: 비교 / 깨달음 -->
  <section class="screen compare" id="compare"></section>
  <section class="screen thesis" id="thesis"></section>

  <script src="data.js"></script>
  <script src="main.js"></script>
